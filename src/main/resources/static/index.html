
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusFind - Lost & Found</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            margin: 0;
            color: #1e293b;
        }

        header {
            background: #173b63;
            color: white;
            text-align: center;
            padding: 25px;
        }

        main {
            max-width: 650px;
            margin: 30px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 3px 12px #00000012;
        }

        input, textarea, select {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin: 8px 0 15px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #173b63;
        }

        .item {
            border-bottom: 1px solid #ddd;
            padding: 12px 0;
        }

        #message {
            font-weight: bold;
        }

        .returned {
            color: green;
            font-weight: bold;
        }

        .not-returned {
            color: #d97706;
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>
    <h1>CampusFind</h1>
    <p>Lost something on campus? Let's find it!</p>
</header>

<main>

    <section class="card">
        <h2>Report a Lost Item</h2>

        <form id="lostItemForm">

            <label>Item Name</label>
            <input type="text" id="itemName" required>

            <label>Category</label>
            <select id="category" required>
                <option value="">Choose category</option>
                <option>Electronics</option>
                <option>Accessories</option>
                <option>Books</option>
                <option>Other</option>
            </select>

            <label>Location</label>
            <input type="text" id="location" required>

            <label>Date Lost</label>
            <input type="date" id="dateLost" required>

            <label>Description</label>
            <textarea id="description" required></textarea>

            <label>Contact Number</label>
            <input type="text" id="contact" required>

            <button type="submit">Submit Report</button>

        </form>

        <p id="message"></p>
    </section>

    <section class="card">

        <h2>Reported Lost Items</h2>

        <input
            type="text"
            id="searchInput"
            placeholder="Search for an item..."
        >

        <div id="itemsList">Loading items...</div>

    </section>

</main>

<script>

    const form = document.getElementById("lostItemForm");
    const message = document.getElementById("message");
    const itemsList = document.getElementById("itemsList");
    const searchInput = document.getElementById("searchInput");

    async function loadItems() {

        try {

            const response = await fetch("/api/lost-items");

            if (!response.ok) {
                throw new Error("Could not load items");
            }

            const items = await response.json();

            itemsList.innerHTML = "";

            if (items.length === 0) {
                itemsList.textContent = "No lost items reported yet.";
                return;
            }

            const searchTerm = searchInput.value.toLowerCase();

            const filteredItems = items.filter(item =>
                item.itemName.toLowerCase().includes(searchTerm)
            );

            if (filteredItems.length === 0) {
                itemsList.textContent = "No matching items found.";
                return;
            }

            filteredItems.forEach(item => {

                const div = document.createElement("div");
                div.className = "item";

                const title = document.createElement("h3");
                title.textContent = item.itemName;

                const details = document.createElement("p");

                details.textContent =
                    "Category: " + item.category +
                    " | Location: " + item.location;

                const status = document.createElement("p");

                status.textContent = item.returned
                    ? "Status: Returned"
                    : "Status: Not Returned";

                status.className = item.returned
                    ? "returned"
                    : "not-returned";

                div.appendChild(title);
                div.appendChild(details);
                div.appendChild(status);

                if (!item.returned) {

                    const button = document.createElement("button");

                    button.textContent = "Mark as Returned";

                    button.addEventListener("click", async () => {

                        try {

                            const updateResponse = await fetch(
                                `/api/lost-items/${item.id}/returned`,
                                {
                                    method: "PUT"
                                }
                            );

                            if (!updateResponse.ok) {
                                throw new Error("Update failed");
                            }

                            loadItems();

                        } catch (error) {

                            alert("Could not update item status.");

                        }

                    });

                    div.appendChild(button);

                }

                itemsList.appendChild(div);

            });

        } catch (error) {

            itemsList.textContent = "Could not load items.";

        }

    }

    form.addEventListener("submit", async function(event) {

        event.preventDefault();

        const item = {

            itemName: document.getElementById("itemName").value,
            category: document.getElementById("category").value,
            location: document.getElementById("location").value,
            dateLost: document.getElementById("dateLost").value,
            description: document.getElementById("description").value,
            contact: document.getElementById("contact").value

        };

        try {

            const response = await fetch("/api/lost-items", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(item)

            });

            if (!response.ok) {
                throw new Error("Submission failed");
            }

            message.textContent =
                "Your lost item was reported successfully!";

            message.style.color = "green";

            form.reset();

            loadItems();

        } catch (error) {

            message.textContent =
                "Something went wrong. Please try again.";

            message.style.color = "red";

        }

    });

    searchInput.addEventListener("input", loadItems);

    loadItems();

</script>

</body>
</html>
